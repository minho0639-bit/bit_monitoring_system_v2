<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기능 테스트</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-gray-800 mb-8">🔧 기능 테스트</h1>
        
        <!-- Service Status -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">📊 서비스 상태</h2>
            <div id="serviceStatus" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Will be populated by JavaScript -->
            </div>
        </div>

        <!-- Basic Function Tests -->
        <div class="bg-white rounded-lg shadow p-6 mb-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">🧪 기본 기능 테스트</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <button id="testStorage" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                    <i class="fas fa-database mr-2"></i>Storage 테스트
                </button>
                <button id="testEmailService" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700">
                    <i class="fas fa-envelope mr-2"></i>Email Service 테스트
                </button>
                <button id="testNoSignupEmail" class="px-4 py-2 bg-emerald-600 text-white rounded-lg hover:bg-emerald-700">
                    <i class="fas fa-paper-plane mr-2"></i>No-Signup Email 테스트
                </button>
                <button id="testHostAdd" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700">
                    <i class="fas fa-plus mr-2"></i>호스트 추가 테스트
                </button>
                <button id="testEmailSettings" class="px-4 py-2 bg-orange-600 text-white rounded-lg hover:bg-orange-700">
                    <i class="fas fa-cog mr-2"></i>이메일 설정 테스트
                </button>
                <button id="testAllFeatures" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700">
                    <i class="fas fa-rocket mr-2"></i>전체 테스트
                </button>
            </div>
        </div>

        <!-- Test Results -->
        <div class="bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-gray-800">📋 테스트 결과</h2>
                <button id="clearResults" class="px-3 py-1 text-sm bg-gray-600 text-white rounded hover:bg-gray-700">
                    <i class="fas fa-trash mr-1"></i>지우기
                </button>
            </div>
            <div id="results" class="bg-gray-900 text-green-400 p-4 rounded-lg font-mono text-sm h-96 overflow-y-auto">
                <div class="text-gray-500">테스트 결과가 여기에 표시됩니다...</div>
            </div>
        </div>
    </div>

    <script src="js/storage-service.js"></script>
    <script src="js/no-signup-email-service.js"></script>
    <script src="js/email-service.js"></script>
    <script>
        let testResults = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            log('🚀 기능 테스트 시작');
            checkServiceStatus();
        });

        // Logging function
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = `[${timestamp}] ${message}`;
            testResults.push(logEntry);
            
            const resultsDiv = document.getElementById('results');
            const div = document.createElement('div');
            div.className = getLogClass(type);
            div.textContent = logEntry;
            resultsDiv.appendChild(div);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
            
            console.log(message);
        }

        function getLogClass(type) {
            switch(type) {
                case 'success': return 'text-green-400';
                case 'error': return 'text-red-400';
                case 'warning': return 'text-yellow-400';
                default: return 'text-green-400';
            }
        }

        // Check service status
        function checkServiceStatus() {
            const statusDiv = document.getElementById('serviceStatus');
            let statusHtml = '';

            // Check Storage Service
            const storageOk = typeof window.storageService !== 'undefined';
            statusHtml += `
                <div class="p-3 rounded border ${storageOk ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}">
                    <h3 class="font-semibold text-sm">Storage Service</h3>
                    <p class="text-xs ${storageOk ? 'text-green-600' : 'text-red-600'}">
                        ${storageOk ? '✅ 정상' : '❌ 오류'}
                    </p>
                </div>
            `;

            // Check Email Service
            const emailOk = typeof window.EmailService !== 'undefined';
            statusHtml += `
                <div class="p-3 rounded border ${emailOk ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}">
                    <h3 class="font-semibold text-sm">Email Service</h3>
                    <p class="text-xs ${emailOk ? 'text-green-600' : 'text-red-600'}">
                        ${emailOk ? '✅ 정상' : '❌ 오류'}
                    </p>
                </div>
            `;

            // Check No-Signup Email Service
            const noSignupOk = typeof window.NoSignupEmailService !== 'undefined';
            statusHtml += `
                <div class="p-3 rounded border ${noSignupOk ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'}">
                    <h3 class="font-semibold text-sm">No-Signup Email</h3>
                    <p class="text-xs ${noSignupOk ? 'text-green-600' : 'text-red-600'}">
                        ${noSignupOk ? '✅ 정상' : '❌ 오류'}
                    </p>
                </div>
            `;

            statusDiv.innerHTML = statusHtml;

            // Log overall status
            if (storageOk && emailOk && noSignupOk) {
                log('✅ 모든 서비스가 정상적으로 로드되었습니다', 'success');
            } else {
                log('❌ 일부 서비스에 문제가 있습니다', 'error');
            }
        }

        // Test functions
        document.getElementById('testStorage').addEventListener('click', () => {
            try {
                log('🗄️ Storage Service 테스트 시작...');
                
                if (!window.storageService) {
                    throw new Error('Storage Service가 로드되지 않았습니다');
                }

                // Test basic operations
                const testHost = {
                    name: '테스트 서버',
                    ip_address: '192.168.1.100',
                    description: 'Storage 테스트용',
                    monitor_interval: 60,
                    is_active: true,
                    last_status: 'unknown',
                    email_alerts: true
                };

                const addedHost = window.storageService.addHost(testHost);
                log(`✅ 호스트 추가 성공: ${addedHost.name} (ID: ${addedHost.id})`, 'success');

                const hosts = window.storageService.getHosts();
                log(`✅ 호스트 조회 성공: ${hosts.length}개 호스트`, 'success');

                window.storageService.deleteHost(addedHost.id);
                log('✅ 호스트 삭제 성공', 'success');

                log('✅ Storage Service 테스트 완료', 'success');

            } catch (error) {
                log(`❌ Storage Service 테스트 실패: ${error.message}`, 'error');
            }
        });

        document.getElementById('testEmailService').addEventListener('click', () => {
            try {
                log('📧 Email Service 테스트 시작...');
                
                if (!window.EmailService) {
                    throw new Error('Email Service가 로드되지 않았습니다');
                }

                const emailService = new EmailService();
                log('✅ Email Service 인스턴스 생성 성공', 'success');

                const methods = emailService.getAvailableMethods();
                log(`✅ 사용 가능한 방법: ${methods.join(', ')}`, 'success');

                log('✅ Email Service 테스트 완료', 'success');

            } catch (error) {
                log(`❌ Email Service 테스트 실패: ${error.message}`, 'error');
            }
        });

        document.getElementById('testNoSignupEmail').addEventListener('click', () => {
            try {
                log('🚀 No-Signup Email Service 테스트 시작...');
                
                if (!window.NoSignupEmailService) {
                    throw new Error('No-Signup Email Service가 로드되지 않았습니다');
                }

                const noSignupService = new NoSignupEmailService();
                log('✅ No-Signup Email Service 인스턴스 생성 성공', 'success');

                const methods = noSignupService.getAvailableMethods();
                log(`✅ 사용 가능한 방법: ${methods.join(', ')}`, 'success');

                const status = noSignupService.getServiceStatus();
                log(`✅ 서비스 상태 조회 성공`, 'success');

                log('✅ No-Signup Email Service 테스트 완료', 'success');

            } catch (error) {
                log(`❌ No-Signup Email Service 테스트 실패: ${error.message}`, 'error');
            }
        });

        document.getElementById('testHostAdd').addEventListener('click', () => {
            try {
                log('➕ 호스트 추가 기능 테스트 시작...');
                
                if (!window.storageService) {
                    throw new Error('Storage Service가 필요합니다');
                }

                const testHost = {
                    name: '기능테스트서버',
                    ip_address: '10.0.0.1',
                    description: '호스트 추가 기능 테스트',
                    monitor_interval: 30,
                    is_active: true,
                    last_status: 'unknown',
                    email_alerts: false
                };

                const result = window.storageService.addHost(testHost);
                log(`✅ 호스트 추가 성공: ${result.name}`, 'success');

                // Clean up
                window.storageService.deleteHost(result.id);
                log('✅ 테스트 호스트 정리 완료', 'success');

                log('✅ 호스트 추가 기능 테스트 완료', 'success');

            } catch (error) {
                log(`❌ 호스트 추가 기능 테스트 실패: ${error.message}`, 'error');
            }
        });

        document.getElementById('testEmailSettings').addEventListener('click', () => {
            try {
                log('⚙️ 이메일 설정 기능 테스트 시작...');
                
                if (!window.storageService) {
                    throw new Error('Storage Service가 필요합니다');
                }

                const testSettings = {
                    smtp_server: 'smtp.test.com',
                    smtp_port: 587,
                    username: 'test@test.com',
                    password: 'test-password',
                    from_email: 'monitor@test.com',
                    to_emails: ['admin@test.com'],
                    is_enabled: true,
                    browser_notifications: false
                };

                const result = window.storageService.saveEmailSettings(testSettings);
                log(`✅ 이메일 설정 저장 성공: ${result.smtp_server}`, 'success');

                const loaded = window.storageService.getEmailSettings();
                log(`✅ 이메일 설정 로드 성공: ${loaded.smtp_server}`, 'success');

                log('✅ 이메일 설정 기능 테스트 완료', 'success');

            } catch (error) {
                log(`❌ 이메일 설정 기능 테스트 실패: ${error.message}`, 'error');
            }
        });

        document.getElementById('testAllFeatures').addEventListener('click', () => {
            log('🚀 전체 기능 테스트 시작...');
            
            // Run all tests in sequence
            setTimeout(() => document.getElementById('testStorage').click(), 100);
            setTimeout(() => document.getElementById('testEmailService').click(), 500);
            setTimeout(() => document.getElementById('testNoSignupEmail').click(), 1000);
            setTimeout(() => document.getElementById('testHostAdd').click(), 1500);
            setTimeout(() => document.getElementById('testEmailSettings').click(), 2000);
            
            setTimeout(() => {
                log('🎉 전체 기능 테스트 완료!', 'success');
            }, 2500);
        });

        document.getElementById('clearResults').addEventListener('click', () => {
            document.getElementById('results').innerHTML = '<div class="text-gray-500">테스트 결과가 여기에 표시됩니다...</div>';
            testResults = [];
        });
    </script>
</body>
</html>
