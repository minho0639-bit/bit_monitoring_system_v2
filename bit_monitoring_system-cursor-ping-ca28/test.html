<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네트워크 모니터링 시스템 - 테스트</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { color: green; }
        .error { color: red; }
        button { margin: 5px; padding: 10px 15px; }
        #results { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>네트워크 모니터링 시스템 - 기능 테스트</h1>
    
    <div class="test-section">
        <h2>Storage Service 테스트</h2>
        <button onclick="testStorageService()">Storage Service 초기화 테스트</button>
        <button onclick="testAddHost()">호스트 추가 테스트</button>
        <button onclick="testEmailSettings()">이메일 설정 테스트</button>
        <button onclick="showStoredData()">저장된 데이터 확인</button>
        <button onclick="clearAllData()">모든 데이터 삭제</button>
    </div>
    
    <div id="results"></div>

    <script src="js/storage-service.js"></script>
    <script>
        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            results.appendChild(div);
            console.log(message);
        }

        function testStorageService() {
            try {
                if (window.storageService) {
                    log('✅ Storage Service 초기화 성공', 'success');
                    return true;
                } else {
                    log('❌ Storage Service 초기화 실패', 'error');
                    return false;
                }
            } catch (error) {
                log(`❌ Storage Service 오류: ${error.message}`, 'error');
                return false;
            }
        }

        function testAddHost() {
            try {
                if (!testStorageService()) return;

                const testHost = {
                    name: '테스트 서버',
                    ip_address: '192.168.1.100',
                    description: '테스트용 서버입니다',
                    monitor_interval: 60,
                    is_active: true,
                    last_status: 'unknown',
                    last_check: null,
                    email_alerts: true
                };

                const result = window.storageService.addHost(testHost);
                log(`✅ 호스트 추가 성공: ${result.name} (${result.ip_address})`, 'success');
                log(`   - ID: ${result.id}`, 'info');
                return true;
            } catch (error) {
                log(`❌ 호스트 추가 실패: ${error.message}`, 'error');
                return false;
            }
        }

        function testEmailSettings() {
            try {
                if (!testStorageService()) return;

                const testSettings = {
                    smtp_server: 'smtp.gmail.com',
                    smtp_port: 587,
                    username: 'test@gmail.com',
                    password: 'test-password',
                    from_email: 'monitor@company.com',
                    to_emails: ['admin@company.com', 'ops@company.com'],
                    is_enabled: true,
                    browser_notifications: true
                };

                const result = window.storageService.saveEmailSettings(testSettings);
                log(`✅ 이메일 설정 저장 성공`, 'success');
                log(`   - SMTP: ${result.smtp_server}:${result.smtp_port}`, 'info');
                log(`   - 수신자: ${result.to_emails.join(', ')}`, 'info');
                return true;
            } catch (error) {
                log(`❌ 이메일 설정 저장 실패: ${error.message}`, 'error');
                return false;
            }
        }

        function showStoredData() {
            try {
                if (!testStorageService()) return;

                const hosts = window.storageService.getHosts();
                const emailSettings = window.storageService.getEmailSettings();

                log(`📊 저장된 호스트 수: ${hosts.length}`, 'info');
                hosts.forEach((host, index) => {
                    log(`   ${index + 1}. ${host.name} (${host.ip_address})`, 'info');
                });

                if (emailSettings) {
                    log(`📧 이메일 설정: ${emailSettings.smtp_server}:${emailSettings.smtp_port}`, 'info');
                } else {
                    log(`📧 이메일 설정: 없음`, 'info');
                }

                return true;
            } catch (error) {
                log(`❌ 데이터 조회 실패: ${error.message}`, 'error');
                return false;
            }
        }

        function clearAllData() {
            try {
                if (!testStorageService()) return;
                
                if (confirm('모든 데이터를 삭제하시겠습니까?')) {
                    window.storageService.clearAllData();
                    log(`🗑️ 모든 데이터 삭제 완료`, 'success');
                }
                return true;
            } catch (error) {
                log(`❌ 데이터 삭제 실패: ${error.message}`, 'error');
                return false;
            }
        }

        // 자동 초기화 테스트
        window.addEventListener('load', () => {
            log('🚀 페이지 로드 완료, 자동 테스트 시작');
            setTimeout(() => {
                testStorageService();
            }, 100);
        });
    </script>
</body>
</html>
