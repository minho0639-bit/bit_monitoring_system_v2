<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>호스트 상태 테스트</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .host { margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .online { background-color: #d4edda; border-color: #c3e6cb; }
        .offline { background-color: #f8d7da; border-color: #f5c6cb; }
        .unknown { background-color: #fff3cd; border-color: #ffeaa7; }
        .status { font-weight: bold; }
        button { margin: 5px; padding: 5px 10px; }
    </style>
</head>
<body>
    <h1>호스트 상태 테스트</h1>
    <button onclick="loadHosts()">호스트 로드</button>
    <button onclick="testPing()">Ping 테스트</button>
    <button onclick="clearResults()">결과 지우기</button>
    
    <div id="results"></div>

    <script>
        let hosts = [];

        async function loadHosts() {
            try {
                const response = await fetch('/api/hosts');
                hosts = await response.json();
                displayHosts();
            } catch (error) {
                console.error('Error loading hosts:', error);
                document.getElementById('results').innerHTML = '<p>Error loading hosts: ' + error.message + '</p>';
            }
        }

        async function testPing() {
            for (const host of hosts) {
                try {
                    const response = await fetch(`/api/ping/${host.id}`, { method: 'POST' });
                    const result = await response.json();
                    console.log(`Ping result for ${host.name}:`, result);
                } catch (error) {
                    console.error(`Error pinging ${host.name}:`, error);
                }
            }
            
            // Wait a bit then reload hosts
            setTimeout(loadHosts, 2000);
        }

        function displayHosts() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<h2>호스트 목록</h2>';
            
            for (const host of hosts) {
                const hostDiv = document.createElement('div');
                hostDiv.className = 'host';
                
                // Get latest ping result
                getLatestPingResult(host.id).then(pingResult => {
                    if (pingResult) {
                        const status = pingResult.is_online ? 'online' : 'offline';
                        const statusText = pingResult.is_online ? '온라인' : '오프라인';
                        
                        hostDiv.classList.add(status);
                        hostDiv.innerHTML = `
                            <div class="status">${host.name} (${host.ip_address}) - ${statusText}</div>
                            <div>응답시간: ${pingResult.response_time || 'N/A'}ms</div>
                            <div>시간: ${new Date(pingResult.timestamp).toLocaleString()}</div>
                        `;
                    } else {
                        hostDiv.classList.add('unknown');
                        hostDiv.innerHTML = `
                            <div class="status">${host.name} (${host.ip_address}) - 알 수 없음</div>
                            <div>Ping 결과 없음</div>
                        `;
                    }
                });
                
                resultsDiv.appendChild(hostDiv);
            }
        }

        async function getLatestPingResult(hostId) {
            try {
                const response = await fetch(`/api/hosts/${hostId}/ping-results?limit=1`);
                const results = await response.json();
                return results.length > 0 ? results[0] : null;
            } catch (error) {
                console.error(`Error getting ping results for host ${hostId}:`, error);
                return null;
            }
        }

        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }

        // Load hosts on page load
        window.onload = loadHosts;
    </script>
</body>
</html>
